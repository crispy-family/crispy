name: CI/CD with Tests and SonarCloud

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Build, Test and Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          dotnet-sonarscanner begin /k:"crispy-manual-key_crispy" /o:"crispy-manual-key" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io"
          dotnet build Crispy.Web/Crispy.Web.csproj --configuration Release
          dotnet test Crispy.Web/Crispy.Web.csproj --no-build --verbosity normal
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Publish
        run: dotnet publish Crispy.Web/Crispy.Web.csproj -c Release -o ./publish

      - name: Deploy to Azure Web App
        if: github.event_name == 'push'
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'crispy-app' 
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish
